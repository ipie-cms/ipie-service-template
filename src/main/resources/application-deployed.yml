# What is true of EVERY deployed environment - DEV, SIT, UAT, PPE and PROD alike.
#
# ACTIVATE IT ALONGSIDE THE ENVIRONMENT PROFILE, IN THIS ORDER:
#
#     SPRING_PROFILES_ACTIVE=deployed,prod
#
# Order matters and is not decoration. Spring applies profile-specific documents in the order the
# profiles are listed, so the environment profile must come second to override anything here. A
# manifest that sets SPRING_PROFILES_ACTIVE=prod alone gets application.yml's development-friendly
# defaults - full trace sampling, path-style object storage - with none of the hardening below.
#
# This file replaces the previous single application-prod.yml, which described itself as covering
# "a real (DEV/SIT/UAT/PROD) environment". One profile for five environments meant every difference
# between them had to be expressed as an environment variable, so no file said what UAT actually
# differs from Production in - which is precisely the question a release review asks.
#
# SUPPLIED EXTERNALLY, NOT HERE - application.yml ships no default for any of these, so startup
# fails when they are missing rather than running on a development value (master standards doc, 14):
#   - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI - a real Keycloak realm
#   - SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD - the managed Postgres instance
#   - SPRING_FLYWAY_USER / _PASSWORD - the owner role that runs migrations
#   - IPIE_STORAGE_S3_ENDPOINT / _ACCESS_KEY / _SECRET_KEY / _BUCKET / _REGION and
#     IPIE_STORAGE_S3_SSE_KMS_KEY_ID
#   - IPIE_CORS_ALLOWED_ORIGINS - the real frontend origin
#   - IPIE_SCANNING_CLAMAV_HOST - fails closed, rejecting all uploads, if left unset
#   - IPIE_TRUSTED_PROXIES - without it every caller presents the gateway address and shares one
#     rate-limit bucket
#   - SPRING_RABBITMQ_HOST or SPRING_KAFKA_BOOTSTRAP_SERVERS

spring:
  jpa:
    hibernate:
      # Restated deliberately. Never update/create in a deployed environment: Flyway is the only
      # thing allowed to change the schema (master standards doc, section 8).
      ddl-auto: validate

server:
  error:
    # An error response tells the caller what failed, never how the server is built.
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  tracing:
    sampling:
      # A middle default. Each environment overrides it: verbose where traces are being read,
      # sparse where traffic volume makes them expensive.
      probability: ${IPIE_TRACING_SAMPLING_PROBABILITY:0.2}

logging:
  level:
    in.gov.ipie: INFO

ipie:
  security:
    # Never disabled outside a laptop - see application-local.yml's own warning.
    enabled: true
  storage:
    s3:
      # Real object storage uses virtual-hosted-style addressing, not MinIO's path-style.
      path-style-access: false
      sse:
        # Server-side encryption with a managed key, per master standards doc Section 12, item 17.
        # Enabling this with an empty key id silently falls back to AES256 - supply the key id.
        enabled: true
